# payments: a PDB that blocks any eviction (drain demo), a failed Job, a CronJob and a
# Deployment scaled to zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-api
  namespace: payments
  labels:
    app: settlement-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement-api
  template:
    metadata:
      labels:
        app: settlement-api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: payments
spec:
  clusterIP: None
  selector:
    app: ledger
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: payments
  labels:
    app: ledger
spec:
  serviceName: ledger
  replicas: 3
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
        - name: ledger
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
# minAvailable == replicas: no ledger pod may ever be evicted, so a drain waits on it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger
  namespace: payments
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: ledger
---
apiVersion: batch/v1
kind: Job
metadata:
  name: settlement-20261014-0200
  namespace: payments
  labels:
    app: settlement
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: settlement
    spec:
      restartPolicy: Never
      containers:
        - name: settle
          image: busybox:1.36
          command: ["sh", "-c", "echo settling; exit 1"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-settlement
  namespace: payments
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: settle
              image: busybox:1.36
              command: ["sh", "-c", "echo settling; exit 0"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks
  namespace: payments
  labels:
    app: webhooks
spec:
  replicas: 0
  selector:
    matchLabels:
      app: webhooks
  template:
    metadata:
      labels:
        app: webhooks
    spec:
      containers:
        - name: webhooks
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
