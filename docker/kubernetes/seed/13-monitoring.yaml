# monitoring: a pod no node can ever fit (Pending / Unschedulable).
# reporting: a pod stuck in ContainerCreating on a ConfigMap that doesn't exist (FailedMount).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              memory: 999Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: reporting
  labels:
    app: report-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-builder
  template:
    metadata:
      labels:
        app: report-builder
    spec:
      containers:
        - name: builder
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: config
              mountPath: /etc/reports
      volumes:
        - name: config
          configMap:
            name: reports-config-missing
