# checkout: the healthy-but-busy namespace. payment-gateway v1 is the good rollout that
# 30-payment-gateway-v2.yaml later breaks (OOM crash loop + stuck rollout).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: checkout
  labels:
    app: payment-gateway
  annotations:
    kubernetes.io/change-cause: "initial"
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: payment-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: REDIS_URL
            - name: MERCHANT_CACHE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: MERCHANT_CACHE_SIZE
            - name: CACHE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: CACHE_TTL_SECONDS
            - name: FEATURE_FLAGS
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: FEATURE_FLAGS
            - name: PROVIDERS_JSON
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: PROVIDERS_JSON
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-live
                  key: api-key
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: checkout
  labels:
    app: payment-gateway
spec:
  selector:
    app: payment-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: checkout
  labels:
    app: checkout-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # Read by the Architecture page's dependency detection (Service DNS names in env).
          env:
            - name: PAYMENTS_URL
              value: "http://payment-gateway"
            - name: CART_URL
              value: "http://cart.checkout.svc.cluster.local:80"
            - name: PRICING_URL
              value: "http://pricing:80"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: checkout
spec:
  selector:
    app: checkout-api
  ports:
    - port: 80
      targetPort: 80
---
# HPA-managed, so the Scale dialog can show "managed by HPA checkout-api (3-6)".
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-api
  namespace: checkout
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: checkout
  labels:
    app: cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: checkout
  labels:
    app: pricing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
    spec:
      containers:
        - name: pricing
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: CACHE_HOST
              value: "cart-redis:6379"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
