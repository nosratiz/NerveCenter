# platform: a DaemonSet whose only pod crash-loops on a config error.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-shipper
  namespace: platform
  labels:
    app: log-shipper
spec:
  selector:
    matchLabels:
      app: log-shipper
  template:
    metadata:
      labels:
        app: log-shipper
    spec:
      containers:
        - name: shipper
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 5; echo 'config error: missing SHIPPER_TOKEN'; exit 1"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
