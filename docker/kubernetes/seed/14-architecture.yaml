# Architecture page demo: the Services, store and Ingress the env in 10-checkout / 11-payments
# point at, so the dependency map has edges (cart-redis is also what gateway-config's REDIS_URL
# names). k3s runs without Traefik, so the Ingress is never served; it only feeds the map.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cart-redis
  namespace: checkout
  labels:
    app: cart-redis
spec:
  replicas: 1
  serviceName: cart-redis
  selector:
    matchLabels:
      app: cart-redis
  template:
    metadata:
      labels:
        app: cart-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart-redis
  namespace: checkout
spec:
  selector:
    app: cart-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: checkout
spec:
  selector:
    app: cart
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pricing
  namespace: checkout
spec:
  selector:
    app: pricing
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: checkout
spec:
  rules:
    - host: shop.checkout.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout-api
                port:
                  number: 80
