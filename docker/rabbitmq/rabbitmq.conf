# Loaded by the `rabbitmq` compose service (docker-compose.yml, profile: rabbitmq).
# Definitions are imported on every boot; with a definitions file configured, RabbitMQ does not
# create the default guest user, so docker/rabbitmq/definitions.json declares `admin` itself.
load_definitions = /etc/rabbitmq/definitions.json
loopback_users = none
# Management samples every 5 s (the default); rates on a fresh broker need two samples.
management.rates_mode = basic
