# Local development stack for NerveCenter (SbConsole).
#
#   docker compose up -d                       # Kafka broker + seeded topics + Kafka UI
#   docker compose --profile servicebus up -d  # ...plus the Azure Service Bus emulator
#   docker compose --profile rabbitmq up -d    # ...plus RabbitMQ, seeded vhost /orders
#   docker compose --profile aws up -d         # ...plus LocalStack (SQS/SNS)
#   docker compose --profile redis up -d       # ...plus Redis, seeded with sample keys
#   docker compose --profile postgres up -d    # ...plus PostgreSQL 16, seeded, with a live lock-contention demo
#   docker compose --profile app up -d --build # ...plus SbConsole itself, built from source
#
# The app itself normally runs on the host via `dotnet run` (see .claude/launch.json); this
# file provides the brokers it talks to. Connection secrets to paste into the app's
# "Connections" page are listed in docker/README.md.

name: nervecenter

services:
  # ---------------------------------------------------------------------------------------
  # Apache Kafka, single-node KRaft (no ZooKeeper).
  #   - localhost:9092  from the host (what `dotnet run` and the Kafka plugin use)
  #   - kafka:29092     from other containers on the compose network
  # ---------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.1.0
    container_name: nervecenter-kafka
    # KRaft resolves the container's own hostname at startup and exits on a transient Docker DNS
    # "Try again" (UnknownHostException) -- without a restart policy the broker just stays down.
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker: every internal topic must be replication-factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off so the plugin's "Create topic" is meaningful and a typo'd topic name fails loudly
      # instead of silently materialising an empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot: creates the sample topics, fills them with messages and sets up consumer groups
  # with a range of lag so the Topics, Peek, Consumer groups and Dead-letter pages have something
  # to show. Idempotent: only topics it creates get messages, and group offsets are re-reset.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: nervecenter-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./docker/kafka/init-topics.sh:/init-topics.sh:ro
    restart: "no"

  # Web UI for the broker, independent of SbConsole -- useful for confirming what the plugin
  # did (or didn't) do, and for poking at consumer groups before the plugin supports them.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: nervecenter-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------------------------------------------------------------------------------------
  # LocalStack (profile: aws) -- SQS + SNS emulator for manual testing of the AWS plugin.
  # STS backs the plugin's Test connection (GetCallerIdentity); CloudWatch backs the topic
  # delivery-failure count and the oldest-dead-letter tile; Logs backs the SNS delivery-logs tab.
  # Without sts, every Test connection against this emulator fails.
  # ---------------------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3
    container_name: nervecenter-localstack
    profiles: ["aws"]
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sqs,sns,sts,cloudwatch,logs
      DEBUG: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates a couple of sample queues so the Queues page has something to show.
  # Idempotent; re-runs are harmless.
  aws-init:
    image: amazon/aws-cli:2.17.62
    container_name: nervecenter-aws-init
    profiles: ["aws"]
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-queues.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./docker/aws/init-queues.sh:/init-queues.sh:ro
    restart: "no"

  # ---------------------------------------------------------------------------------------
  # RabbitMQ 3.13 with the management and shovel plugins (profile: rabbitmq), seeded with the
  # topology the RabbitMQ plugin's mockup is drawn from (vhost /orders). AMQP is published on
  # 5673 by default, not 5672, because the Service Bus emulator already claims 5672 on the host.
  # ---------------------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: nervecenter-rabbitmq
    profiles: ["rabbitmq"]
    hostname: rabbit-local
    ports:
      - "${RABBITMQ_AMQP_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s

  # One-shot: publishes sample messages (including some that dead-letter into payments-dlq).
  rabbitmq-init:
    image: curlimages/curl:8.10.1
    container_name: nervecenter-rabbitmq-init
    profiles: ["rabbitmq"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-messages.sh"]
    environment:
      RABBIT_API: http://rabbitmq:15672/api
    volumes:
      - ./docker/rabbitmq/init-messages.sh:/init-messages.sh:ro
    restart: "no"

  # ---------------------------------------------------------------------------------------
  # Redis 7 (profile: redis), seeded with a handful of sample keys across the data types the
  # Redis plugin's mockup shows (a couple of session hashes, a retry list, a leaderboard sorted
  # set, a feature-flag set) so the Overview and Keys pages have something to show.
  # ---------------------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nervecenter-redis
    profiles: ["redis"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # maxmemory gives the Overview page's memory tile a real ceiling (and eviction threshold) to show.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sbconsole}", "--maxmemory", "16mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sbconsole}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: seeds the sample keys. Idempotent (HSET/SADD/ZADD overwrite-in-place; RPUSH is the
  # one exception, so this deliberately checks LLEN first rather than growing the list on every
  # `docker compose up`).
  redis-init:
    image: redis:7-alpine
    container_name: nervecenter-redis-init
    profiles: ["redis"]
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-keys.sh"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-sbconsole}"
    volumes:
      - ./docker/redis/init-keys.sh:/init-keys.sh:ro
    restart: "no"

  # Long-running (not one-shot) live traffic, every 5s: a Pub/Sub heartbeat to notifications:live
  # (Pub/Sub has no history, so a channel only shows activity while something publishes to it),
  # plus a new orders:stream entry that the healthy consumers read and ack.
  redis-pubsub-demo:
    image: redis:7-alpine
    container_name: nervecenter-redis-pubsub-demo
    profiles: ["redis"]
    depends_on:
      # After the seed, not alongside it: this XADDs to orders:stream, which the seed only
      # creates (with its consumer groups) when the stream doesn't exist yet.
      redis-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/publish-demo.sh"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-sbconsole}"
    volumes:
      - ./docker/redis/publish-demo.sh:/publish-demo.sh:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Azure Service Bus emulator (profile: servicebus). Needs SQL Server as its store.
  # SQL Server 2022 ships amd64 only, so on Apple Silicon it runs under emulation --
  # slower to start (~30-60s) but works. Both images require ACCEPT_EULA=Y.
  # ---------------------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nervecenter-sqlserver
    platform: linux/amd64
    profiles: ["servicebus"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SbEmulator!Local1}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: nervecenter-servicebus
    profiles: ["servicebus"]
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${SERVICEBUS_AMQP_PORT:-5672}:5672"
      # Published on host port 80 on purpose. The Azure SDK derives two endpoints from one
      # connection string: ServiceBusClient (AMQP) uses the endpoint's port or 5672, while
      # ServiceBusAdministrationClient (HTTP) uses the endpoint's port or 80. A connection
      # string that names a port therefore breaks one of the two -- only an unported
      # `Endpoint=sb://localhost` reaches both, and only if the management API answers on 80.
      - "${SERVICEBUS_HTTP_PORT:-80}:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SbEmulator!Local1}
      SQL_WAIT_INTERVAL: 0
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  # One-shot: sends sample messages (active, dead-lettered, scheduled) into the entities
  # Config.json declares. Python rather than a shell script because the emulator only accepts
  # sends over AMQP. Skips itself when `orders` already has messages.
  servicebus-init:
    image: python:3.12-slim
    container_name: nervecenter-servicebus-init
    profiles: ["servicebus"]
    depends_on:
      servicebus-emulator:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "pip install --quiet --disable-pip-version-check --root-user-action=ignore 'azure-servicebus>=7.12' && python /seed.py"]
    volumes:
      - ./docker/servicebus/seed.py:/seed.py:ro
    restart: "no"

  # ---------------------------------------------------------------------------------------
  # SQLite demo files (profile: sqlite). One-shot: builds reports.db, shop.db, corrupt.db,
  # reference.db, an empty new.db and a writable backups/ directory (the demo connections'
  # BackupDir, /sqlite/backups) in the sqlite-demo volume,
  # which the app profile mounts at /sqlite with SBC_SQLITE_ROOTS=/sqlite. Deliberately not /data:
  # that holds SbConsole's own database and data-protection keys. Idempotent; rebuild with
  #   docker compose --profile sqlite run --rm sqlite-init python -I /seed.py --force /sqlite
  # ---------------------------------------------------------------------------------------
  sqlite-init:
    image: python:3.12-alpine
    container_name: nervecenter-sqlite-init
    profiles: ["sqlite"]
    command: ["python", "-I", "/seed.py", "/sqlite"]
    volumes:
      - ./docker/sqlite/seed.py:/seed.py:ro
      - sqlite-demo:/sqlite
    restart: "no"

  # ---------------------------------------------------------------------------------------
  # PostgreSQL 16 (profile: postgres), seeded on first init of the postgres-data volume from
  # docker/postgres/init (databases app, analytics, billing; ~1.1M rows in app). pg_stat_statements
  # is preloaded and track_io_timing is on so the plugin's Overview/Query EXPLAIN have data.
  # Published on 5433, not 5432, to stay clear of a local Postgres. The healthcheck uses TCP
  # (127.0.0.1) on purpose: the entrypoint's temporary init server only listens on a unix socket,
  # so a socket check would report healthy halfway through seeding.
  # ---------------------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: nervecenter-postgres
    profiles: ["postgres"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
    environment:
      POSTGRES_USER: sbconsole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbconsole}
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sbconsole -d app"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 10s

  # Long-running: one session idle in transaction holding a row lock on orders.id=1
  # (application_name checkout-api) and two sessions waiting on it (checkout-api,
  # fulfilment-worker), so the Activity page has a blocking chain to show. The cycle restarts
  # every 15 minutes; it never exits on errors.
  postgres-blocker:
    image: postgres:16
    container_name: nervecenter-postgres-blocker
    profiles: ["postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/blocker.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sbconsole}
    volumes:
      - ./docker/postgres/blocker.sh:/blocker.sh:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # SbConsole itself (profile: app), built from source. For when you want the "one shared
  # instance per team" deployment shape locally rather than `dotnet run`.
  # ---------------------------------------------------------------------------------------
  sbconsole:
    build:
      context: .
      dockerfile: Dockerfile
    image: nervecenter/sbconsole:local
    container_name: nervecenter-sbconsole
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_healthy
    # So the containerised app can reach the Service Bus emulator through the host's published
    # ports (see docker/README.md): the emulator's own container answers management calls on
    # 5300, not the port 80 the Azure SDK's admin client derives from an unported endpoint.
    # host-gateway makes this work on plain Linux Docker as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SBC_HOST_PORT:-5249}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      SBC_BIND: http://0.0.0.0:8080
      SBC_DB_PATH: /data/sbconsole.db
      # Required; the app refuses to start without them. Set in .env (see .env.example).
      SBC_DATA_KEY: ${SBC_DATA_KEY:-}
      SBC_ADMIN_PASSWORD: ${SBC_ADMIN_PASSWORD:-}
      SBC_API_KEY: ${SBC_API_KEY:-}
      # Directories the SQLite plugin may open files under (fail-closed when unset).
      SBC_SQLITE_ROOTS: /sqlite
      # Demo connections created at startup if missing (create-only; docker/README.md "SQLite").
      SBC_DEMO_CONNECTIONS: /demo/connections.json
    volumes:
      - sbconsole-data:/data
      - sqlite-demo:/sqlite
      - ./docker/sqlite/demo-connections.json:/demo/connections.json:ro

volumes:
  kafka-data:
  sqlserver-data:
  sbconsole-data:
  sqlite-demo:
  postgres-data:
