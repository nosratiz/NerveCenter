# Local development stack for NerveCenter (SbConsole).
#
#   docker compose up -d                       # Kafka broker + seeded topics + Kafka UI
#   docker compose --profile servicebus up -d  # ...plus the Azure Service Bus emulator
#   docker compose --profile app up -d --build # ...plus SbConsole itself, built from source
#
# The app itself normally runs on the host via `dotnet run` (see .claude/launch.json); this
# file provides the brokers it talks to. Connection secrets to paste into the app's
# "Connections" page are listed in docker/README.md.

name: nervecenter

services:
  # ---------------------------------------------------------------------------------------
  # Apache Kafka, single-node KRaft (no ZooKeeper).
  #   - localhost:9092  from the host (what `dotnet run` and the Kafka plugin use)
  #   - kafka:29092     from other containers on the compose network
  # ---------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.1.0
    container_name: nervecenter-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker: every internal topic must be replication-factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off so the plugin's "Create topic" is meaningful and a typo'd topic name fails loudly
      # instead of silently materialising an empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot: creates the sample topics and drops a few messages in them so the Topics and
  # Peek pages have something to show. Idempotent (--if-not-exists); re-runs re-produce the
  # sample messages, which is harmless.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: nervecenter-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./docker/kafka/init-topics.sh:/init-topics.sh:ro
    restart: "no"

  # Web UI for the broker, independent of SbConsole -- useful for confirming what the plugin
  # did (or didn't) do, and for poking at consumer groups before the plugin supports them.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: nervecenter-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------------------------------------------------------------------------------------
  # LocalStack (profile: aws) -- SQS + SNS emulator for manual testing of the AWS plugin.
  # SNS is enabled now (not just SQS) so the SNS plan (docs/superpowers/specs/
  # 2026-09-21-aws-sqs-plugin-design.md §1) needs no compose change later.
  # ---------------------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3
    container_name: nervecenter-localstack
    profiles: ["aws"]
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sqs,sns
      DEBUG: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: creates a couple of sample queues so the Queues page has something to show.
  # Idempotent; re-runs are harmless.
  aws-init:
    image: amazon/aws-cli:2.17.62
    container_name: nervecenter-aws-init
    profiles: ["aws"]
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-queues.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./docker/aws/init-queues.sh:/init-queues.sh:ro
    restart: "no"

  # ---------------------------------------------------------------------------------------
  # Azure Service Bus emulator (profile: servicebus). Needs SQL Server as its store.
  # SQL Server 2022 ships amd64 only, so on Apple Silicon it runs under emulation --
  # slower to start (~30-60s) but works. Both images require ACCEPT_EULA=Y.
  # ---------------------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nervecenter-sqlserver
    platform: linux/amd64
    profiles: ["servicebus"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SbEmulator!Local1}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: nervecenter-servicebus
    profiles: ["servicebus"]
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${SERVICEBUS_AMQP_PORT:-5672}:5672"
      # Published on host port 80 on purpose. The Azure SDK derives two endpoints from one
      # connection string: ServiceBusClient (AMQP) uses the endpoint's port or 5672, while
      # ServiceBusAdministrationClient (HTTP) uses the endpoint's port or 80. A connection
      # string that names a port therefore breaks one of the two -- only an unported
      # `Endpoint=sb://localhost` reaches both, and only if the management API answers on 80.
      - "${SERVICEBUS_HTTP_PORT:-80}:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SbEmulator!Local1}
      SQL_WAIT_INTERVAL: 0
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  # ---------------------------------------------------------------------------------------
  # SbConsole itself (profile: app), built from source. For when you want the "one shared
  # instance per team" deployment shape locally rather than `dotnet run`.
  # ---------------------------------------------------------------------------------------
  sbconsole:
    build:
      context: .
      dockerfile: Dockerfile
    image: nervecenter/sbconsole:local
    container_name: nervecenter-sbconsole
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_healthy
    # So the containerised app can reach the Service Bus emulator through the host's published
    # ports (see docker/README.md): the emulator's own container answers management calls on
    # 5300, not the port 80 the Azure SDK's admin client derives from an unported endpoint.
    # host-gateway makes this work on plain Linux Docker as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SBC_HOST_PORT:-5249}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      SBC_BIND: http://0.0.0.0:8080
      SBC_DB_PATH: /data/sbconsole.db
      # Required; the app refuses to start without them. Set in .env (see .env.example).
      SBC_DATA_KEY: ${SBC_DATA_KEY:-}
      SBC_ADMIN_PASSWORD: ${SBC_ADMIN_PASSWORD:-}
      SBC_API_KEY: ${SBC_API_KEY:-}
    volumes:
      - sbconsole-data:/data

volumes:
  kafka-data:
  sqlserver-data:
  sbconsole-data:
